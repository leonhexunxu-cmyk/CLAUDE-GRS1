[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.2.0"
description = "Flight recorder, regression lab, permission sandbox and tripwires for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.setuptools]
packages = ["agentlab"]

[tool.setuptools.package-data]
agentlab = ["ui/*.html"]
